name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # gofumpt is not in the Go toolchain, and golangci-lint vendors its own
      # (older) copy that no config enables — so without this step nothing ever
      # checked Go formatting, while OpenTofu's was gated below all along. The
      # version comes from the Makefile so CI and `make fmt` cannot drift apart:
      # a gate formatting differently from the devshell is worse than no gate.
      - name: Setup gofumpt
        run: go install mvdan.cc/gofumpt@$(make -s print-gofumpt-version)

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: golangci-lint run ./...

  tofu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Check formatting
        run: make tofu-fmt-check

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm --prefix apps/web ci

      - name: Lint
        run: npm --prefix apps/web run lint

      - name: Test
        run: npm --prefix apps/web run test

      - name: Build
        run: npm --prefix apps/web run build
